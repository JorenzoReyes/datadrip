[build]
builder = "dockerfile"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[[services]]
name = "datadrip"

[[services]]
name = "postgres"

[volumes]
"/app/public/uploads" = "uploads"